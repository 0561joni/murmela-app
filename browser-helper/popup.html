<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Murmela speaker names</title>
    <style>
      :root { color-scheme: light dark; }
      body { width: 280px; margin: 0; padding: 14px 16px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      h1 { margin: 0 0 6px; font-size: 14px; }
      p { margin: 6px 0 0; }
      .muted { opacity: 0.7; }
      .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #9aa0a6; }
      .on .dot { background: #c0392b; }
    </style>
  </head>
  <body>
    <h1>Murmela speaker names</h1>
    <p id="state"><span class="dot"></span><span id="label">Checking…</span></p>
    <p class="muted" id="hint"></p>
    <p class="muted">Only participant names and when they speak go to Murmela on this computer. Nothing is sent anywhere else.</p>
    <script src="popup.js"></script>
  </body>
</html>
