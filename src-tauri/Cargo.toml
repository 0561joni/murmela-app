[package]
name = "murmela"
version = "1.1.1"
description = "Local-first desktop transcription app"
license = "GPL-3.0-only"
edition = "2021"
default-run = "murmela"

[lib]
name = "murmela_lib"
crate-type = ["rlib"]

[[bin]]
name = "murmela"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
cc = "1.2.57"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
cpal = "0.17.3"
fs2 = "0.4.3"
hound = "3.5.1"
libc = "0.2.183"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sherpa-onnx = "1.13.5"
sha2 = "0.10.9"
strsim = "0.11.1"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "pcm", "vorbis", "wav"] }
tauri = { version = "2.10.3", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-global-shortcut = "2.3.1"
uuid = { version = "1.22.0", features = ["serde", "v4"] }
unicode-normalization = "0.1.25"
whatlang = "0.16"
tauri-plugin-updater = "2.12.0"
tauri-plugin-deep-link = "2"
whisper-rs = { version = "0.16.0", features = ["metal"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSValue", "NSUUID", "NSObject"] }

# Model checksums hash gigabytes; unoptimised SHA-256 runs at ~30 MB/s and
# trips the translation model's verification timeout in dev builds.
[profile.dev.package.sha2]
opt-level = 3
